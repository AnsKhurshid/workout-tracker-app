targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store DateTime as ISO-8601 text: keeps milliseconds and UTC offset,
          # sorts correctly, and is readable when inspecting the database.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
